[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safederm"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
executionEnvironments = [
  { root = ".", extraPaths = ["."] }
]
